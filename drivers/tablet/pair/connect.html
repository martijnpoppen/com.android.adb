<style>
  .adb-field { margin-bottom: 1em; }
  .adb-field label { display: block; margin-bottom: .3em; font-weight: 500; }
  .adb-field input, .adb-field select { width: 100%; box-sizing: border-box; }
  .adb-row { display: flex; gap: 1em; }
  .adb-row .adb-field { flex: 1; }
  .adb-note { opacity: .7; font-size: .9em; margin: .5em 0 1em; }
  .adb-section { margin: 1.5em 0 .5em; font-weight: 600; }
  .adb-link { display: inline-block; margin: 0 0 1em; color: #0082fa; cursor: pointer; text-decoration: underline; font-weight: 500; }
  .adb-help { margin-bottom: 1.5em; }
  .adb-help h3 { margin: 1em 0 .4em; font-size: 1em; }
  .adb-help h3:first-of-type { margin-top: .5em; }
  .adb-help ol { margin: 0; padding-left: 1.4em; }
  .adb-help li { margin-bottom: .45em; line-height: 1.35; }
  .adb-tip { margin-top: 1em; padding: .7em .9em; border-radius: 8px; background: rgba(255, 170, 0, .15); font-size: .92em; line-height: 1.35; }
  .adb-found { display: flex; flex-wrap: wrap; gap: .5em; margin-bottom: 1em; }
  .adb-chip { border: 1px solid rgba(128, 128, 128, .5); border-radius: 999px; padding: .4em .9em; cursor: pointer; font-size: .9em; background: transparent; color: inherit; }
  .adb-chip.selected { border-color: #0082fa; color: #0082fa; }
  .adb-chip.added { opacity: .5; }
</style>

<!-- First page: address, pairing code, connect. The instructions only open from the link. -->

<header class="homey-header">
  <h1 class="homey-title" data-i18n="title"></h1>
  <p class="homey-subtitle" data-i18n="subtitle"></p>
</header>

<a class="adb-link" id="showHelp" data-i18n="help_show"></a>

<form class="homey-form" onsubmit="return false;">
  <div id="foundBlock" style="display:none">
    <div class="adb-section" style="margin-top:0" data-i18n="found"></div>
    <div class="adb-found" id="found"></div>
  </div>

  <div class="adb-row">
    <div class="adb-field">
      <label class="homey-form-label" for="host" data-i18n="ip_address"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.50" />
    </div>
    <div class="adb-field">
      <label class="homey-form-label" for="port" data-i18n="port"></label>
      <input class="homey-form-input" id="port" type="number" placeholder="43499" />
    </div>
  </div>
  <p class="adb-note" data-i18n="address_note"></p>

  <div class="adb-section" data-i18n="pairing_code_section"></div>
  <div class="adb-row">
    <div class="adb-field">
      <label class="homey-form-label" for="pairingCode" data-i18n="pairing_code"></label>
      <input class="homey-form-input" id="pairingCode" type="text" inputmode="numeric" placeholder="123456" />
    </div>
    <div class="adb-field">
      <label class="homey-form-label" for="pairingPort" data-i18n="pairing_port"></label>
      <input class="homey-form-input" id="pairingPort" type="number" placeholder="37123" />
    </div>
  </div>
  <p class="adb-note" data-i18n="pairing_note"></p>

  <button class="homey-button-primary-full" id="connect" data-i18n="connect"></button>
</form>

<script type="application/javascript">
  function field(id) { return document.getElementById(id); }

  /* All texts live in /locales/<language>.json under "pair". */
  function t(key) { return Homey.__('pair.' + key); }

  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
    el.innerHTML = t(el.getAttribute('data-i18n'));
  });

  field('showHelp').addEventListener('click', function () { Homey.showView('instructions'); });

  /* ---------- Devices announcing Wireless debugging ---------- */

  function select(device, chip) {
    field('host').value = device.address;
    field('port').value = device.port;
    Array.prototype.forEach.call(document.querySelectorAll('.adb-chip'), function (el) { el.classList.remove('selected'); });
    if (chip) chip.classList.add('selected');
  }

  Homey.emit('discover').then(function (devices) {
    if (!devices || !devices.length) return;
    field('foundBlock').style.display = '';
    var firstNew = null;
    devices.forEach(function (device) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'adb-chip' + (device.added ? ' added' : '');
      chip.textContent = device.address + (device.added ? ' ' + t('already_added') : '');
      chip.addEventListener('click', function () { select(device, chip); });
      field('found').appendChild(chip);
      if (!device.added && !firstNew) firstNew = { device: device, chip: chip };
    });
    if (firstNew && !field('host').value) select(firstNew.device, firstNew.chip);
  }).catch(function () {});

  /* ---------- Connect ---------- */

  field('connect').addEventListener('click', function () {
    Homey.showLoadingOverlay();
    Homey.emit('connect', {
      host: field('host').value,
      port: field('port').value,
      pairingCode: field('pairingCode').value,
      pairingPort: field('pairingPort').value,
    })
      .then(function (result) {
        if (result.repaired) return null;
        return Homey.createDevice(result.device);
      })
      .then(function () { Homey.done(); })
      .catch(function (err) {
        Homey.hideLoadingOverlay();
        Homey.alert(err && err.message ? err.message : String(err));
      });
  });
</script>
